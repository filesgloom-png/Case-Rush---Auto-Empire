name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Archive web build
        run: |
          cd dist
          zip -qr ../case-rush-web.zip .
      - name: Verify artifact
        run: |
          test -s case-rush-web.zip
          sha256sum case-rush-web.zip
          wc -c case-rush-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: case-rush-web
          path: case-rush-web.zip
          if-no-files-found: error
